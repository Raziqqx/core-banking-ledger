name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: mvn verify (unit, contract and Testcontainers ITs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker, which Testcontainers uses for Postgres and Redpanda.
      - run: mvn -B verify
      - name: Upload test reports and the concurrency run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
            app/target/concurrency_it.csv

  docker:
    name: docker build and image scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t core-banking-ledger:${{ github.sha }} .
      # Report-only for now: findings are listed in the log but do not fail the build.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: core-banking-ledger:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  helm:
    name: helm lint and schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: helm lint deploy/helm/core-banking-ledger
      - run: |
          helm template ci deploy/helm/core-banking-ledger > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary < rendered.yaml
