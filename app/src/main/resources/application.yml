spring:
  application:
    name: core-banking-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}
    hikari:
      maximum-pool-size: 20
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    # Trace context rides in Kafka headers (producer and listener observations)
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: true
  # JWT validation: the `dev` profile supplies an in-memory issuer (DevTokenIssuer). Any other
  # profile must point at a real issuer, e.g.
  # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI=https://idp.example/realms/bank;
  # without one there is no JwtDecoder and the app refuses to start (it never runs open).

ledger:
  locking: PESSIMISTIC   # or OPTIMISTIC; see DECISIONS.md

payments:
  topic: payment-events

ratelimit:
  payments:          # per client (JWT subject), per instance
    capacity: ${PAYMENTS_RATE_CAPACITY:30}
    period: ${PAYMENTS_RATE_PERIOD:PT1M}

outbox:
  relay:
    enabled: true
    interval-ms: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/liveness and /readiness for Kubernetes
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    # Off by default so tests and plain local runs do not try to reach a collector;
    # the observability compose profile, the Dockerfile and the Helm chart turn it on.
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  # Structured JSON logs (ECS, with traceId/spanId from the MDC) when LOG_FORMAT=ecs;
  # the default stays human-readable for local runs.
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    org.apache.kafka: WARN
