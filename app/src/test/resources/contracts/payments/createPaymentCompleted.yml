description: A customer pays from their own account; the saga completes and the payment is returned.
name: create_payment_completed
request:
  method: POST
  url: /payments
  headers:
    Content-Type: application/json
    Authorization: Bearer eyJhbGciOiJSUzI1NiJ9.contract.sig
    Idempotency-Key: 3f2a7c1e-9d4b-4e8a-b1c2-5a6d7e8f9a0b
  body:
    fromAccount: 1
    toAccount: 2
    amount: 2500
    currency: SGD
    reference: invoice-42
  matchers:
    headers:
      - key: Authorization
        regex: "Bearer .+"
      - key: Idempotency-Key
        regex: "[A-Za-z0-9-]{1,100}"
response:
  status: 201
  headers:
    Content-Type: application/json
  body:
    id: 7d1c2b3a-4e5f-4a6b-8c7d-9e0f1a2b3c4d
    fromAccount: 1
    toAccount: 2
    amount: 2500
    currency: SGD
    reference: invoice-42
    status: COMPLETED
    holdId: 11
    entryId: 22
    createdAt: "2026-11-15T10:00:00Z"
  matchers:
    body:
      - path: $.id
        type: by_regex
        predefined: uuid
      - path: $.holdId
        type: by_type
      - path: $.entryId
        type: by_type
      - path: $.createdAt
        type: by_regex
        value: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z"
