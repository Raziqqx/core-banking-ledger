{{- if not .Values.secret.existingSecret }}
# Placeholder secret for local clusters only; production uses secret.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cbl.fullname" . }}
  labels: {{- include "cbl.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secret.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secret.anthropicApiKey | quote }}
{{- end }}
